<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    <title>🛒 בונה קניות חכם</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .install-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255,255,255,0.3);
            color: white;
            border: 2px solid white;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: none;
        }
        .install-btn.show { display: block; }
        .tabs {
            display: flex;
            background: #f0f0f0;
            border-bottom: 2px solid #ddd;
        }
        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            color: #666;
        }
        .tab-btn.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }
        .content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #667eea;
        }
        .section h2 { color: #333; margin-bottom: 15px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: 600; color: #555; margin-bottom: 6px; }
        input[type="number"] {
            width: 70px;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            text-align: center;
        }
        .meal-counter {
            background: white;
            padding: 8px;
            border-radius: 6px;
            margin-top: 4px;
            color: #667eea;
            font-weight: 600;
            font-size: 0.85em;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 15px;
        }
        .reset-btn { background: #dc3545; margin-top: 8px; }
        .shopping-list { background: white; padding: 20px; border-radius: 10px; border-top: 5px solid #70ad47; }
        .category-section { margin-bottom: 20px; }
        .category-title {
            background: #70ad47;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .item-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
        .item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            border-right: 4px solid #70ad47;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-name { font-weight: 600; color: #333; flex: 1; }
        .item-qty { display: flex; gap: 8px; align-items: center; }
        .item-quantity {
            background: #70ad47;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 600;
            white-space: nowrap;
            font-size: 0.85em;
        }
        .item-controls { display: flex; gap: 5px; }
        .edit-btn, .delete-btn {
            padding: 6px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            color: white;
        }
        .edit-btn { background: #007bff; }
        .delete-btn { background: #dc3545; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
        }
        .modal-content h3 { margin-bottom: 15px; color: #333; }
        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
        }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button { flex: 1; margin: 0; }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .item-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="install-btn" id="installBtn" onclick="installApp()">📲 הוסף לטלפון</button>
            <h1>🛒 בונה קניות חכם</h1>
            <p>איתם ועדי</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(0)">📋 בנייה</button>
            <button class="tab-btn" onclick="switchTab(1)">📊 טבלאות</button>
            <button class="tab-btn" onclick="switchTab(2)">🛍️ קניות</button>
        </div>

        <div class="content">
            <!-- TAB 1 -->
            <div class="tab-content active">
                <div class="grid">
                    <div class="section">
                        <h2>🥩 בחרו ארוחות</h2>
                        <div class="input-group">
                            <label>דג לבן</label>
                            <input type="number" id="dagLaban" min="0" max="7" value="0">
                            <div class="meal-counter" id="dagCounter"></div>
                        </div>
                        <div class="input-group">
                            <label>סלמון</label>
                            <input type="number" id="salmon" min="0" max="7" value="0">
                            <div class="meal-counter" id="salmonCounter"></div>
                        </div>
                        <div class="input-group">
                            <label>בקר</label>
                            <input type="number" id="beef" min="0" max="7" value="0">
                            <div class="meal-counter" id="beefCounter"></div>
                        </div>
                        <div class="input-group">
                            <label>עוף</label>
                            <input type="number" id="chicken" min="0" max="7" value="0">
                            <div class="meal-counter" id="chickenCounter"></div>
                        </div>
                        <div class="input-group">
                            <label>טופו</label>
                            <input type="number" id="tofu" min="0" max="7" value="0">
                            <div class="meal-counter" id="tofuCounter"></div>
                        </div>
                        <button onclick="calculateShoppingList()">📋 חשב</button>
                        <button class="reset-btn" onclick="resetSelection()">🔄 איפוס</button>
                    </div>
                    <div class="section">
                        <h2>📊 סיכום</h2>
                        <div class="meal-counter" style="font-size: 1.3em;" id="totalMeals">0 ארוחות</div>
                    </div>
                </div>
            </div>

            <!-- TAB 2 -->
            <div class="tab-content">
                <div class="section">
                    <h2>איתם</h2>
                    <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
                        <tr style="background: #667eea; color: white;">
                            <th style="padding: 10px; text-align: right;">מרכיב</th>
                            <th style="padding: 10px; text-align: right;">כמות</th>
                            <th style="padding: 10px; text-align: right;">יחידה</th>
                        </tr>
                        <tbody id="itamTable"></tbody>
                    </table>
                </div>
                <div class="section" style="margin-top: 20px;">
                    <h2>עדי</h2>
                    <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
                        <tr style="background: #667eea; color: white;">
                            <th style="padding: 10px; text-align: right;">מרכיב</th>
                            <th style="padding: 10px; text-align: right;">כמות</th>
                            <th style="padding: 10px; text-align: right;">יחידה</th>
                        </tr>
                        <tbody id="ediTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- TAB 3 -->
            <div class="tab-content">
                <div id="noList" style="text-align: center; padding: 40px; color: #999;">
                    <p>📋 חשבו את הקניות</p>
                </div>
                <div class="shopping-list" id="shoppingListContainer" style="display: none;">
                    <h2>🛍️ קניות</h2>
                    <p style="color: #666; font-size: 0.9em; margin-bottom: 15px;">✏️ = ערוך | 🗑️ = מחק</p>
                    <div id="shoppingListContent"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3>ערוך</h3>
            <input type="text" id="editItemName" readonly style="background: #f0f0f0;">
            <input type="number" id="editItemQty">
            <input type="text" id="editItemUnit">
            <div class="modal-buttons">
                <button onclick="saveEdit()" style="background: #28a745;">💾 שמור</button>
                <button onclick="closeEdit()" style="background: #dc3545;">ביטול</button>
            </div>
        </div>
    </div>

    <script>
        let deferredPrompt;
        let shoppingList = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').classList.add('show');
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(r => {
                    if (r.outcome === 'accepted') {
                        document.getElementById('installBtn').classList.remove('show');
                    }
                    deferredPrompt = null;
                });
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadSelections();
            populateTables();
            updateCounters();
            updateTotal();
            document.querySelectorAll('input[type="number"]').forEach(input => {
                input.addEventListener('change', () => {
                    saveSelections();
                    updateCounters();
                    updateTotal();
                });
            });
        });

        function switchTab(i) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-content')[i].classList.add('active');
            document.querySelectorAll('.tab-btn')[i].classList.add('active');
        }

        function saveSelections() {
            localStorage.setItem('meals', JSON.stringify({
                dagLaban: document.getElementById('dagLaban').value,
                salmon: document.getElementById('salmon').value,
                beef: document.getElementById('beef').value,
                chicken: document.getElementById('chicken').value,
                tofu: document.getElementById('tofu').value
            }));
        }

        function loadSelections() {
            const s = localStorage.getItem('meals');
            if (s) {
                const d = JSON.parse(s);
                ['dagLaban', 'salmon', 'beef', 'chicken', 'tofu'].forEach(id => {
                    document.getElementById(id).value = d[id] || 0;
                });
            }
        }

        function resetSelection() {
            ['dagLaban', 'salmon', 'beef', 'chicken', 'tofu'].forEach(id => {
                document.getElementById(id).value = 0;
            });
            localStorage.removeItem('meals');
            updateCounters();
            updateTotal();
        }

        function updateCounters() {
            const w = {
                dagLaban: {itam: 250, edi: 160},
                salmon: {itam: 220, edi: 120},
                beef: {itam: 250, edi: 160},
                chicken: {itam: 250, edi: 160},
                tofu: {itam: 250, edi: 160}
            };
            Object.entries(w).forEach(([id, wt]) => {
                const m = parseInt(document.getElementById(id).value) || 0;
                const it = m * wt.itam;
                const ed = m * wt.edi;
                document.getElementById(id + 'Counter').textContent = `אתם: ${it}ג | עדי: ${ed}ג | סה"כ: ${it+ed}ג`;
            });
        }

        function updateTotal() {
            const m = ['dagLaban', 'salmon', 'beef', 'chicken', 'tofu'].reduce((s, id) => s + (parseInt(document.getElementById(id).value) || 0), 0);
            document.getElementById('totalMeals').textContent = m + ' ארוחות';
        }

        function populateTables() {
            const it = [
                {n: 'דג לבן', q: 1750, u: 'גרם'},
                {n: 'סלמון', q: 1540, u: 'גרם'},
                {n: 'בקר', q: 1750, u: 'גרם'},
                {n: 'עוף', q: 1750, u: 'גרם'},
                {n: 'אורז', q: 1500, u: 'גרם'},
                {n: 'בטטה', q: 2000, u: 'גרם'},
            ];
            const ed = [
                {n: 'דג לבן', q: 1120, u: 'גרם'},
                {n: 'סלמון', q: 840, u: 'גרם'},
                {n: 'בקר', q: 1120, u: 'גרם'},
                {n: 'עוף', q: 1120, u: 'גרם'},
                {n: 'אורז', q: 840, u: 'גרם'},
                {n: 'בטטה', q: 1120, u: 'גרם'},
            ];
            document.getElementById('itamTable').innerHTML = it.map(i => `<tr style="border: 1px solid #ddd;"><td style="padding: 10px; text-align: right;">${i.n}</td><td style="padding: 10px; text-align: right;">${i.q}</td><td style="padding: 10px; text-align: right;">${i.u}</td></tr>`).join('');
            document.getElementById('ediTable').innerHTML = ed.map(i => `<tr style="border: 1px solid #ddd;"><td style="padding: 10px; text-align: right;">${i.n}</td><td style="padding: 10px; text-align: right;">${i.q}</td><td style="padding: 10px; text-align: right;">${i.u}</td></tr>`).join('');
        }

        function calculateShoppingList() {
            const s = {
                dagLaban: parseInt(document.getElementById('dagLaban').value) || 0,
                salmon: parseInt(document.getElementById('salmon').value) || 0,
                beef: parseInt(document.getElementById('beef').value) || 0,
                chicken: parseInt(document.getElementById('chicken').value) || 0,
                tofu: parseInt(document.getElementById('tofu').value) || 0
            };
            const m = [];
            const md = {
                dagLaban: {itam: 250, edi: 160, name: 'דג לבן'},
                salmon: {itam: 220, edi: 120, name: 'סלמון'},
                beef: {itam: 250, edi: 160, name: 'בקר'},
                chicken: {itam: 250, edi: 160, name: 'עוף'},
                tofu: {itam: 250, edi: 160, name: 'טופו'}
            };
            Object.entries(s).forEach(([k, c]) => {
                if (c > 0) {
                    const d = md[k];
                    m.push({name: d.name, quantity: c * (d.itam + d.edi), unit: 'גרם', category: 'בשרים'});
                }
            });
            const f = [
                {name: 'בננה', q: 14, u: 'יח\'', c: 'ארוחה'},
                {name: 'תפוח', q: 14, u: 'יח\'', c: 'ארוחה'},
                {name: 'אבטיח', q: 2800, u: 'גרם', c: 'ארוחה'},
                {name: 'אורז', q: 2340, u: 'גרם', c: 'פחמימות'},
                {name: 'בטטה', q: 3120, u: 'גרם', c: 'פחמימות'},
                {name: 'עגבניה', q: 7000, u: 'גרם', c: 'ירקות'},
                {name: 'מלפפון', q: 4200, u: 'גרם', c: 'ירקות'},
            ];
            f.forEach(i => m.push({name: i.name, quantity: i.q, unit: i.u, category: i.c}));
            const ca = {};
            m.forEach(i => {
                if (!ca[i.category]) ca[i.category] = [];
                ca[i.category].push(i);
            });
            shoppingList = ca;
            displayShoppingList(ca);
            switchTab(2);
        }

        function displayShoppingList(ca) {
            const c = document.getElementById('shoppingListContent');
            let h = '';
            const o = ['ארוחה', 'בשרים', 'פחמימות', 'ירקות'];
            const e = {'ארוחה': '🌅', 'בשרים': '🥩', 'פחמימות': '🍚', 'ירקות': '🥕'};
            o.forEach(cat => {
                if (ca[cat]) {
                    h += `<div class="category-section"><div class="category-title">${e[cat]} ${cat}</div><div class="item-list">`;
                    ca[cat].forEach(i => {
                        const q = i.quantity % 1 === 0 ? i.quantity : i.quantity.toFixed(1);
                        h += `<div class="item"><span class="item-name">${i.name}</span><div class="item-qty"><span class="item-quantity">${q}${i.unit}</span><div class="item-controls"><button class="edit-btn" onclick="editItem('${i.name}', ${i.quantity}, '${i.unit}')">✏️</button><button class="delete-btn" onclick="deleteItem('${i.name}')">🗑️</button></div></div></div>`;
                    });
                    h += `</div></div>`;
                }
            });
            c.innerHTML = h;
            document.getElementById('shoppingListContainer').style.display = 'block';
            document.getElementById('noList').style.display = 'none';
        }

        function editItem(n, q, u) {
            document.getElementById('editItemName').value = n;
            document.getElementById('editItemQty').value = q;
            document.getElementById('editItemUnit').value = u;
            document.getElementById('editModal').classList.add('show');
        }

        function closeEdit() {
            document.getElementById('editModal').classList.remove('show');
        }

        function saveEdit() {
            const n = document.getElementById('editItemName').value;
            const nq = parseFloat(document.getElementById('editItemQty').value);
            const nu = document.getElementById('editItemUnit').value;
            if (isNaN(nq)) { alert('מספר'); return; }
            Object.values(shoppingList).flat().forEach(i => {
                if (i.name === n) { i.quantity = nq; i.unit = nu; }
            });
            displayShoppingList(shoppingList);
            closeEdit();
        }

        function deleteItem(n) {
            Object.keys(shoppingList).forEach(c => {
                shoppingList[c] = shoppingList[c].filter(i => i.name !== n);
            });
            displayShoppingList(shoppingList);
        }
    </script>
</body>
</html>
