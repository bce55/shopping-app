<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="אפליקציה לבנייה חכמה של רשימת קניות לתכנית חיתוב משותפת">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23667eea' width='192' height='192'/><text x='96' y='120' font-size='120' font-weight='bold' fill='white' text-anchor='middle'>🛒</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23667eea' width='180' height='180'/><text x='90' y='135' font-size='110' font-weight='bold' fill='white' text-anchor='middle'>🛒</text></svg>">
    <title>🛒 בונה קניות חכם</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            padding-top: max(10px, env(safe-area-inset-top));
            padding-bottom: max(10px, env(safe-area-inset-bottom));
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            padding-top: max(20px, env(safe-area-inset-top));
        }

        .header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.95em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #667eea;
        }

        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
            font-size: 0.95em;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-wrapper input {
            width: 70px;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            text-align: center;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
        }

        .meal-counter {
            background: white;
            padding: 8px;
            border-radius: 6px;
            margin-top: 4px;
            color: #667eea;
            font-weight: 600;
            font-size: 0.85em;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: 600;
            width: 100%;
            margin-top: 15px;
        }

        button:active {
            transform: scale(0.98);
        }

        .reset-button {
            background: #dc3545;
            margin-top: 8px;
            padding: 8px 15px;
            font-size: 0.9em;
        }

        .shopping-list {
            grid-column: 1 / -1;
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            border-top: 5px solid #70ad47;
        }

        .shopping-list h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .category-section {
            margin-bottom: 20px;
        }

        .category-title {
            background: #70ad47;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1em;
            margin-bottom: 8px;
        }

        .item-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
        }

        .item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            border-right: 4px solid #70ad47;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }

        .item-name {
            font-weight: 600;
            color: #333;
        }

        .item-quantity {
            background: #70ad47;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 600;
            white-space: nowrap;
            font-size: 0.85em;
        }

        .notes {
            background: #fff3cd;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            border-right: 4px solid #ffc107;
        }

        .notes h3 {
            color: #856404;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .notes ul {
            list-style: none;
            padding-right: 15px;
        }

        .notes li {
            color: #856404;
            margin-bottom: 4px;
            font-size: 0.85em;
            position: relative;
        }

        .notes li:before {
            content: "✓";
            position: absolute;
            right: 100%;
            margin-right: 8px;
            font-weight: bold;
        }

        .offline-indicator {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #ff6b6b;
            color: white;
            padding: 8px;
            text-align: center;
            font-weight: 600;
            z-index: 1000;
            display: none;
        }

        .offline-indicator.show {
            display: block;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.4em;
            }

            .item-list {
                grid-template-columns: 1fr;
            }

            .shopping-list {
                grid-column: 1;
            }

            .section {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-indicator" id="offlineIndicator">
        📡 אתם בעבודה offline - הנתונים שלכם שמורים בטלפון
    </div>

    <div class="container">
        <div class="header">
            <h1>🛒 בונה קניות חכם</h1>
            <p>איתם ועדי - תכנית חיתוב משותפת</p>
        </div>

        <div class="content">
            <!-- MEAL SELECTION -->
            <div class="section">
                <h2>🥩 בחרו ארוחות בשבוע</h2>
                
                <div class="input-group">
                    <label>דג לבן</label>
                    <div class="input-wrapper">
                        <input type="number" id="dagLaban" min="0" max="7" value="0">
                    </div>
                    <div class="meal-counter" id="dagCounter"></div>
                </div>

                <div class="input-group">
                    <label>סלמון</label>
                    <div class="input-wrapper">
                        <input type="number" id="salmon" min="0" max="7" value="0">
                    </div>
                    <div class="meal-counter" id="salmonCounter"></div>
                </div>

                <div class="input-group">
                    <label>בקר</label>
                    <div class="input-wrapper">
                        <input type="number" id="beef" min="0" max="7" value="0">
                    </div>
                    <div class="meal-counter" id="beefCounter"></div>
                </div>

                <div class="input-group">
                    <label>עוף</label>
                    <div class="input-wrapper">
                        <input type="number" id="chicken" min="0" max="7" value="0">
                    </div>
                    <div class="meal-counter" id="chickenCounter"></div>
                </div>

                <div class="input-group">
                    <label>טופו</label>
                    <div class="input-wrapper">
                        <input type="number" id="tofu" min="0" max="7" value="0">
                    </div>
                    <div class="meal-counter" id="tofuCounter"></div>
                </div>

                <button onclick="calculateShoppingList()">📋 חשב קניות</button>
                <button class="reset-button" onclick="resetSelection()">🔄 איפוס</button>
            </div>

            <!-- SUMMARY -->
            <div class="section">
                <h2>📊 סיכום</h2>
                
                <div class="input-group">
                    <label>סה"כ ארוחות:</label>
                    <div class="meal-counter" style="font-size: 1.3em;" id="totalMeals">0</div>
                </div>

                <div class="notes">
                    <h3>ℹ️ מידע חשוב:</h3>
                    <ul>
                        <li><strong>איתם:</strong> 3 אימוני כוח</li>
                        <li><strong>עדי:</strong> 2 אימוני כוח</li>
                        <li>חישוב כללי לשניכם</li>
                        <li>בבית תפצלו לפי משקלכם</li>
                        <li>הנתונים שמורים בטלפון</li>
                    </ul>
                </div>
            </div>

            <!-- SHOPPING LIST -->
            <div class="shopping-list" id="shoppingListContainer" style="display: none;">
                <h2>🛍️ רשימת הקניות</h2>
                <div id="shoppingListContent"></div>
            </div>
        </div>
    </div>

    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').then(reg => {
                console.log('Service Worker registered');
            }).catch(err => {
                console.log('Service Worker registration failed:', err);
            });
        }

        // Check online status
        window.addEventListener('online', () => {
            document.getElementById('offlineIndicator').classList.remove('show');
        });

        window.addEventListener('offline', () => {
            document.getElementById('offlineIndicator').classList.add('show');
        });

        if (!navigator.onLine) {
            document.getElementById('offlineIndicator').classList.add('show');
        }

        // Load and save logic
        window.addEventListener('DOMContentLoaded', function() {
            loadSelections();
            updateCounters();
            updateTotal();
        });

        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.addEventListener('change', function() {
                saveSelections();
                updateCounters();
                updateTotal();
            });
        });

        function saveSelections() {
            const selections = {
                dagLaban: document.getElementById('dagLaban').value,
                salmon: document.getElementById('salmon').value,
                beef: document.getElementById('beef').value,
                chicken: document.getElementById('chicken').value,
                tofu: document.getElementById('tofu').value
            };
            localStorage.setItem('mealSelections', JSON.stringify(selections));
        }

        function loadSelections() {
            const saved = localStorage.getItem('mealSelections');
            if (saved) {
                const selections = JSON.parse(saved);
                document.getElementById('dagLaban').value = selections.dagLaban || 0;
                document.getElementById('salmon').value = selections.salmon || 0;
                document.getElementById('beef').value = selections.beef || 0;
                document.getElementById('chicken').value = selections.chicken || 0;
                document.getElementById('tofu').value = selections.tofu || 0;
            }
        }

        function resetSelection() {
            document.getElementById('dagLaban').value = 0;
            document.getElementById('salmon').value = 0;
            document.getElementById('beef').value = 0;
            document.getElementById('chicken').value = 0;
            document.getElementById('tofu').value = 0;
            localStorage.removeItem('mealSelections');
            document.getElementById('shoppingListContainer').style.display = 'none';
            updateCounters();
            updateTotal();
        }

        function updateCounters() {
            const weights = {
                dagLaban: { itam: 250, edi: 160 },
                salmon: { itam: 220, edi: 120 },
                beef: { itam: 250, edi: 160 },
                chicken: { itam: 250, edi: 160 },
                tofu: { itam: 250, edi: 160 }
            };

            Object.entries(weights).forEach(([id, w]) => {
                const meals = parseInt(document.getElementById(id).value) || 0;
                const itamTotal = meals * w.itam;
                const ediTotal = meals * w.edi;
                const total = itamTotal + ediTotal;
                document.getElementById(id + 'Counter').textContent = 
                    `אתם: ${itamTotal}ג | עדי: ${ediTotal}ג | סה"כ: ${total}ג`;
            });
        }

        function updateTotal() {
            const meals = ['dagLaban', 'salmon', 'beef', 'chicken', 'tofu']
                .reduce((sum, id) => sum + (parseInt(document.getElementById(id).value) || 0), 0);
            document.getElementById('totalMeals').textContent = meals + ' ארוחות';
        }

        function calculateShoppingList() {
            const selections = {
                dagLaban: parseInt(document.getElementById('dagLaban').value) || 0,
                salmon: parseInt(document.getElementById('salmon').value) || 0,
                beef: parseInt(document.getElementById('beef').value) || 0,
                chicken: parseInt(document.getElementById('chicken').value) || 0,
                tofu: parseInt(document.getElementById('tofu').value) || 0
            };

            const meatItems = [];
            const meatData = {
                dagLaban: { itam: 250, edi: 160, name: 'דג לבן' },
                salmon: { itam: 220, edi: 120, name: 'סלמון' },
                beef: { itam: 250, edi: 160, name: 'בקר' },
                chicken: { itam: 250, edi: 160, name: 'עוף' },
                tofu: { itam: 250, edi: 160, name: 'טופו' }
            };

            Object.entries(selections).forEach(([key, count]) => {
                if (count > 0) {
                    const data = meatData[key];
                    meatItems.push({
                        name: data.name,
                        quantity: count * (data.itam + data.edi),
                        unit: 'גרם',
                        category: 'בשרים'
                    });
                }
            });

            const fixedItems = [
                { name: 'בננה', qty: 14, unit: 'יח\'', cat: 'ארוחת בוקר' },
                { name: 'תפוח', qty: 14, unit: 'יח\'', cat: 'ארוחת בוקר' },
                { name: 'אבטיח', qty: 2800, unit: 'גרם', cat: 'ארוחת בוקר' },
                { name: 'אגס', qty: 1050, unit: 'גרם', cat: 'ארוחת בוקר' },
                { name: 'אפרסק', qty: 1050, unit: 'גרם', cat: 'ארוחת בוקר' },
                { name: 'שקדים', qty: 35, unit: 'יח\'', cat: 'ארוחת בוקר' },
                { name: 'מעדן חלבון', qty: 14, unit: 'יח\'', cat: 'ארוחת בוקר' },
                
                { name: 'אורז', qty: 2340, unit: 'גרם', cat: 'פחמימות' },
                { name: 'בטטה', qty: 3120, unit: 'גרם', cat: 'פחמימות' },
                { name: 'קינואה', qty: 2340, unit: 'גרם', cat: 'פחמימות' },
                { name: 'אפונה', qty: 3120, unit: 'גרם', cat: 'פחמימות' },
                { name: 'פסטה', qty: 2340, unit: 'גרם', cat: 'פחמימות' },
                { name: 'עדשים', qty: 3120, unit: 'גרם', cat: 'פחמימות' },
                
                { name: 'עגבניה', qty: 7000, unit: 'גרם', cat: 'ירקות' },
                { name: 'מלפפון', qty: 4200, unit: 'גרם', cat: 'ירקות' },
                { name: 'גזר', qty: 3500, unit: 'גרם', cat: 'ירקות' },
                { name: 'ברוקולי', qty: 4200, unit: 'גרם', cat: 'ירקות' },
                { name: 'כרוב', qty: 2800, unit: 'גרם', cat: 'ירקות' },
                { name: 'תרד', qty: 2450, unit: 'גרם', cat: 'ירקות' },
                
                { name: 'לחם קל', qty: 126, unit: 'פרוסות', cat: 'לחם' },
                { name: 'לחם מלא', qty: 84, unit: 'פרוסות', cat: 'לחם' },
                { name: 'פריכיות אורז', qty: 140, unit: 'יח\'', cat: 'לחם' },
                { name: 'דפי אורז', qty: 140, unit: 'דף', cat: 'לחם' },
                { name: 'פיתה קלה', qty: 21, unit: 'יח\'', cat: 'לחם' },
                { name: 'חטיף פריכיות', qty: 14, unit: 'שקית', cat: 'לחם' },
                
                { name: 'ביצים', qty: 91, unit: 'יח\'', cat: 'חלבוןות' },
                { name: 'טונה בשימור', qty: 24.5, unit: 'קופסה', cat: 'בשרים' },
                { name: 'גבינה צהובה 9%', qty: 49, unit: 'פרוסה', cat: 'חלבוןות' },
                { name: 'קוטג\' 3%', qty: 2100, unit: 'גרם', cat: 'חלבוןות' },
                { name: 'גבינה לבנה 3%', qty: 2100, unit: 'גרם', cat: 'חלבוןות' },
                { name: 'לאבנה 5%', qty: 1750, unit: 'גרם', cat: 'חלבוןות' },
                { name: 'בולגרית 5%', qty: 1750, unit: 'גרם', cat: 'חלבוןות' },
                { name: 'פטה 5%', qty: 1750, unit: 'גרם', cat: 'חלבוןות' },
                
                { name: 'טחינה גולמית', qty: 70, unit: 'גרם', cat: 'שומנים' },
                { name: 'שמן זית', qty: 70, unit: 'גרם', cat: 'שומנים' },
                
                { name: 'שמן (תרסיס)', qty: 70, unit: 'פעמים', cat: 'אחר' },
                { name: 'מים', qty: 38.5, unit: 'ליטר', cat: 'משקאות' }
            ];

            const allItems = [...fixedItems, ...meatItems];
            const categories = {};
            allItems.forEach(item => {
                if (!categories[item.cat]) categories[item.cat] = [];
                categories[item.cat].push({
                    name: item.name,
                    quantity: item.qty,
                    unit: item.unit,
                    category: item.cat
                });
            });

            displayShoppingList(categories);
        }

        function displayShoppingList(categories) {
            const container = document.getElementById('shoppingListContent');
            let html = '';

            const categoryOrder = ['ארוחת בוקר', 'בשרים', 'פחמימות', 'ירקות', 'לחם', 'חלבוןות', 'שומנים', 'משקאות', 'אחר'];
            const emojis = { 'ארוחת בוקר': '🌅', 'בשרים': '🥩', 'פחמימות': '🍚', 'ירקות': '🥕', 'לחם': '🍞', 'חלבוןות': '🥚', 'שומנים': '🫒', 'משקאות': '💧', 'אחר': '⚙️' };

            categoryOrder.forEach(category => {
                if (categories[category]) {
                    html += `<div class="category-section">
                        <div class="category-title">${emojis[category]} ${category}</div>
                        <div class="item-list">`;
                    
                    categories[category].forEach(item => {
                        const qty = item.quantity % 1 === 0 ? item.quantity : item.quantity.toFixed(1);
                        html += `<div class="item">
                            <span class="item-name">${item.name}</span>
                            <span class="item-quantity">${qty}${item.unit}</span>
                        </div>`;
                    });
                    
                    html += `</div></div>`;
                }
            });

            container.innerHTML = html;
            document.getElementById('shoppingListContainer').style.display = 'block';
        }
    </script>
</body>
</html>
