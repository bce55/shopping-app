<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    <title>🛒 בונה קניות חכם - V5 FINAL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 95vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: center;
            position: relative;
        }
        .split-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.3);
            color: white;
            border: 2px solid white;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
        }
        .split-btn:hover { background: rgba(255,255,255,0.5); }
        .tabs {
            display: flex;
            background: #f0f0f0;
            border-bottom: 2px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 100;
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1;
            min-width: 90px;
            padding: 12px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            font-size: 0.85em;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }
        .content {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
        }
        .section h2 { color: #333; margin-bottom: 12px; font-size: 1.1em; }
        input[type="number"], input[type="text"], select {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.95em;
        }
        label { display: block; font-weight: 600; color: #555; margin-top: 8px; margin-bottom: 4px; font-size: 0.95em; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin: 5px;
            font-size: 0.95em;
        }
        button:hover { opacity: 0.9; }
        .btn-delete { background: #dc3545; padding: 5px 10px; font-size: 0.8em; }
        .btn-edit { background: #007bff; padding: 5px 10px; font-size: 0.8em; }
        .btn-add { background: #28a745; }
        .btn-create { background: #ff9800; padding: 12px 20px; font-size: 1em; width: 100%; }
        .btn-reset { background: #6c757d; padding: 10px 15px; margin-top: 10px; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85em;
        }
        table th {
            background: #667eea;
            color: white;
            padding: 8px;
            text-align: right;
            position: sticky;
            top: 0;
        }
        table td {
            padding: 8px;
            border: 1px solid #ddd;
            text-align: right;
        }
        table tr:nth-child(even) { background: #f8f9fa; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .modal-buttons button { flex: 1; margin: 0; }
        .shopping-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
            border-right: 4px solid #70ad47;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shopping-category {
            background: #70ad47;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 8px;
        }
        .nutrition-box {
            background: #e3f2fd;
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
            border-right: 4px solid #2196F3;
        }
        @media (max-width: 768px) {
            .tabs { flex-wrap: wrap; }
            .tab-btn { font-size: 0.75em; padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="split-btn" onclick="showSplitDialog()">🔀 פיצול</button>
            <h1>🛒 בונה קניות חכם</h1>
            <p id="userDisplay">משותף - איתם ועדי</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(0)">📊 טבלאות</button>
            <button class="tab-btn" onclick="switchTab(1)">🍽️ בנייה</button>
            <button class="tab-btn" onclick="switchTab(2)">🛍️ קניות</button>
            <button class="tab-btn" onclick="switchTab(3)">🥗 תזונה</button>
            <button class="tab-btn" onclick="switchTab(4)">🍳 מתכונים</button>
        </div>

        <div class="content">
            <!-- TAB 1: טבלאות -->
            <div class="tab-content active">
                <div class="section">
                    <h2 id="tableTitle">מרכיבים יומיים - איתם ועדי</h2>
                    <button class="btn-add" onclick="editItemDialog(-1)">➕ הוסף מרכיב</button>
                    <button class="btn-reset" onclick="resetTable()">🔄 איפוס לברירת מחדל</button>
                    <table id="mainTable">
                        <thead>
                            <tr>
                                <th>פעולה</th>
                                <th>כמות יומית</th>
                                <th>יחידה</th>
                                <th>מרכיב</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- TAB 2: בנייה -->
            <div class="tab-content">
                <div class="section">
                    <h2>🍗 בחרו ארוחות בשר לשבוע</h2>
                    <p style="color: #666; margin-bottom: 15px;">בחרו כמה ארוחות של כל סוג בשר</p>
                    
                    <div id="buildingInputs"></div>
                </div>

                <button class="btn-create" onclick="createShoppingList()">📋 צור רשימת קניות לשבוע</button>
            </div>

            <!-- TAB 3: קניות -->
            <div class="tab-content">
                <div id="noShoppingList" style="text-align: center; padding: 40px; color: #999;">
                    <p style="font-size: 1.2em;">📋</p>
                    <p>צרו רשימה מהטאב "בנייה"</p>
                </div>
                <div id="shoppingListSection" style="display: none;">
                    <div class="section">
                        <h2>🛍️ רשימת קניות שבועית</h2>
                        <div id="shoppingListContent"></div>
                    </div>
                </div>
            </div>

            <!-- TAB 4: תזונה -->
            <div class="tab-content">
                <div class="section">
                    <h2>🥗 חישובים תזונתיים יומיים</h2>
                    <div id="nutritionContent"></div>
                </div>
            </div>

            <!-- TAB 5: מתכונים -->
            <div class="tab-content">
                <div class="section">
                    <h2>🍳 מתכונים</h2>
                    <button class="btn-add" onclick="editRecipeDialog(-1)">➕ הוסף מתכון</button>
                    <div id="recipesList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modalTitle">עדכון</h3>
            <div id="modalBody"></div>
            <div class="modal-buttons">
                <button onclick="saveModal()" style="background: #28a745;">💾 שמור</button>
                <button onclick="closeModal()" style="background: #dc3545;">❌ ביטול</button>
            </div>
        </div>
    </div>

    <script>
        // משתנים גלובליים
        let currentUser = 'both'; // 'both', 'itam', 'edi'
        let currentModal = null;
        let currentShoppingList = null;
        let recipes = JSON.parse(localStorage.getItem('recipes')) || [];

        // נתונים עיקריים
        const meatOptions = {
            dagLaban: { name: 'דג לבן', itamWeight: 250, ediWeight: 160 },
            salmon: { name: 'סלמון', itamWeight: 220, ediWeight: 120 },
            beef: { name: 'בקר', itamWeight: 250, ediWeight: 160 },
            chicken: { name: 'עוף', itamWeight: 250, ediWeight: 160 },
            tofu: { name: 'טופו', itamWeight: 250, ediWeight: 160 },
            groundBeef: { name: 'בשר טחון', itamWeight: 200, ediWeight: 'N/A' },
            shoulderBeef: { name: 'כתף בקר', itamWeight: 250, ediWeight: 160 },
            turkey: { name: 'חזה הודו', itamWeight: 250, ediWeight: 'N/A' },
            liver: { name: 'כבד עוף', itamWeight: 250, ediWeight: 160 }
        };

        const defaultItems = [
            {name: 'מעדן חלבון', qty: 1, unit: 'יח\''},
            {name: 'בננה', qty: 2, unit: 'יח\''},
            {name: 'תפוח', qty: 1, unit: 'יח\''},
            {name: 'אבטיח', qty: 200, unit: 'גרם'},
            {name: 'אורז', qty: 150, unit: 'גרם'},
            {name: 'בטטה', qty: 200, unit: 'גרם'},
            {name: 'קינואה', qty: 150, unit: 'גרם'},
            {name: 'עדשים', qty: 200, unit: 'גרם'},
            {name: 'עגבניה', qty: 200, unit: 'גרם'},
            {name: 'מלפפון', qty: 150, unit: 'גרם'},
            {name: 'גזר', qty: 100, unit: 'גרם'},
            {name: 'ברוקולי', qty: 150, unit: 'גרם'},
            {name: 'לחם קל', qty: 4, unit: 'פרוסות'},
            {name: 'קוטג\' 3%', qty: 60, unit: 'גרם'},
            {name: 'גבינה לבנה 3%', qty: 60, unit: 'גרם'},
            {name: 'ביצה', qty: 1, unit: 'יח\''},
            {name: 'מים', qty: 1000, unit: 'מ"ל'},
            {name: 'טחינה', qty: 10, unit: 'גרם'}
        ];

        function initApp() {
            let items = JSON.parse(localStorage.getItem('items'));
            if (!items) {
                items = defaultItems;
                localStorage.setItem('items', JSON.stringify(items));
            }
            renderTable();
            renderBuildingInputs();
            renderRecipes();
        }

        function showSplitDialog() {
            const dialog = `
                <p style="margin-bottom: 15px;">מי ממלא את הרשימה?</p>
                <button onclick="setSplitUser('itam')" style="width: 100%; margin-bottom: 10px; background: #667eea;">👨 איתם</button>
                <button onclick="setSplitUser('edi')" style="width: 100%; margin-bottom: 10px; background: #667eea;">👩 עדי</button>
                <button onclick="setSplitUser('both')" style="width: 100%; background: #28a745;">👫 משותף</button>
            `;
            document.getElementById('modalTitle').textContent = 'בחרו מי ממלא';
            document.getElementById('modalBody').innerHTML = dialog;
            document.getElementById('modal').classList.add('show');
        }

        function setSplitUser(user) {
            currentUser = user;
            const names = { itam: 'איתם', edi: 'עדי', both: 'משותף - איתם ועדי' };
            document.getElementById('userDisplay').textContent = names[user];
            closeModal();
            renderTable();
            renderBuildingInputs();
        }

        function switchTab(i) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.tab-content')[i].classList.add('active');
            document.querySelectorAll('.tab-btn')[i].classList.add('active');
            
            if (i === 3) updateNutrition();
            if (i === 4) renderRecipes();
        }

        function renderTable() {
            const items = JSON.parse(localStorage.getItem('items')) || defaultItems;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = items.map((item, i) => `
                <tr>
                    <td>
                        <button class="btn-edit" onclick="editItemDialog(${i})">✏️</button>
                        <button class="btn-delete" onclick="deleteItem(${i})">🗑️</button>
                    </td>
                    <td>${item.qty}</td>
                    <td>${item.unit}</td>
                    <td>${item.name}</td>
                </tr>
            `).join('');
        }

        function editItemDialog(index) {
            const items = JSON.parse(localStorage.getItem('items')) || defaultItems;
            const item = index === -1 ? {name: '', qty: 0, unit: 'גרם'} : items[index];
            
            currentModal = {type: 'item', index};
            document.getElementById('modalTitle').textContent = index === -1 ? 'הוסף מרכיב' : 'ערוך מרכיב';
            document.getElementById('modalBody').innerHTML = `
                <label>שם המרכיב</label>
                <input type="text" id="itemName" value="${item.name}">
                <label>כמות יומית</label>
                <input type="number" id="itemQty" value="${item.qty}" step="0.1">
                <label>יחידה</label>
                <input type="text" id="itemUnit" value="${item.unit}">
            `;
            document.getElementById('modal').classList.add('show');
        }

        function deleteItem(index) {
            const items = JSON.parse(localStorage.getItem('items')) || defaultItems;
            items.splice(index, 1);
            localStorage.setItem('items', JSON.stringify(items));
            renderTable();
        }

        function resetTable() {
            if (confirm('אתה בטוח שאתה רוצה להחזיר את הטבלה לברירת המחדל?')) {
                localStorage.setItem('items', JSON.stringify(defaultItems));
                renderTable();
            }
        }

        function renderBuildingInputs() {
            const html = Object.entries(meatOptions).map(([key, meat]) => `
                <div style="margin-bottom: 15px;">
                    <label>${meat.name}</label>
                    <input type="number" id="meat_${key}" min="0" max="7" value="1" onchange="updateBuildingCounters()">
                    <div style="background: white; padding: 8px; border-radius: 6px; margin-top: 4px; color: #667eea; font-weight: 600; font-size: 0.85em;" id="counter_${key}"></div>
                </div>
            `).join('');
            document.getElementById('buildingInputs').innerHTML = html;
            updateBuildingCounters();
        }

        function updateBuildingCounters() {
            Object.entries(meatOptions).forEach(([key, meat]) => {
                const qty = parseInt(document.getElementById('meat_' + key).value) || 0;
                if (currentUser === 'both') {
                    const total = qty * (meat.itamWeight + meat.ediWeight);
                    document.getElementById('counter_' + key).textContent = `${qty} × (${meat.itamWeight}ג + ${meat.ediWeight}ג) = ${total}ג`;
                } else if (currentUser === 'itam') {
                    const total = qty * meat.itamWeight;
                    document.getElementById('counter_' + key).textContent = `${qty} × ${meat.itamWeight}ג = ${total}ג`;
                } else {
                    const total = qty * meat.ediWeight;
                    document.getElementById('counter_' + key).textContent = `${qty} × ${meat.ediWeight}ג = ${total}ג`;
                }
            });
        }

        function createShoppingList() {
            const items = JSON.parse(localStorage.getItem('items')) || defaultItems;
            const list = {};

            // מרכיבים בסיסיים - עם חישוב ימי אימון לפחמימות
            list['מרכיבים'] = items.map(item => {
                let weeklyQty = item.qty * 7;
                
                // חישוב מיוחד לפחמימות (עבור ימי אימון)
                if (item.name === 'אורז' || item.name === 'בטטה' || item.name === 'קינואה' || item.name === 'עדשים') {
                    if (currentUser === 'itam' || currentUser === 'both') {
                        // איתם: 3 ימי אימון × כמות כפולה + 4 ימים רגילים
                        weeklyQty = (item.qty * 4) + (item.qty * 2 * 3); // 150 → (150×4) + (300×3) = 1500
                    } else if (currentUser === 'edi') {
                        // עדי: 2 ימי אימון × כמות כפולה + 5 ימים רגילים
                        weeklyQty = (item.qty * 5) + (item.qty * 2 * 2); // 120 → (120×5) + (240×2) = 1080
                    }
                }
                
                return {
                    name: item.name,
                    qty: weeklyQty,
                    unit: item.unit
                };
            });

            // בשרים
            list['בשרים'] = [];
            Object.entries(meatOptions).forEach(([key, meat]) => {
                const qty = parseInt(document.getElementById('meat_' + key).value) || 0;
                if (qty > 0) {
                    if (currentUser === 'both') {
                        const total = qty * (meat.itamWeight + meat.ediWeight);
                        list['בשרים'].push({ name: meat.name, qty: total, unit: 'גרם' });
                    } else if (currentUser === 'itam') {
                        const total = qty * meat.itamWeight;
                        list['בשרים'].push({ name: meat.name, qty: total, unit: 'גרם' });
                    } else {
                        const total = qty * meat.ediWeight;
                        list['בשרים'].push({ name: meat.name, qty: total, unit: 'גרם' });
                    }
                }
            });

            // מעדנים וחטיפים
            list['מעדנים וחטיפים'] = [
                { name: 'מעדן חלבון', qty: 7, unit: 'יח\'' },
                { name: 'חטיף חלבון', qty: 7, unit: 'יח\'' }
            ];

            currentShoppingList = list;
            displayShoppingList(list);
            switchTab(2);
        }

        function displayShoppingList(list) {
            document.getElementById('noShoppingList').style.display = 'none';
            document.getElementById('shoppingListSection').style.display = 'block';

            let html = '';
            Object.entries(list).forEach(([category, items]) => {
                if (items.length > 0) {
                    html += `<div class="shopping-category">${category}</div>`;
                    items.forEach(item => {
                        html += `<div class="shopping-item">
                            <span>${item.name}</span>
                            <span style="background: #70ad47; color: white; padding: 6px 12px; border-radius: 6px; font-weight: 600;">${item.qty}${item.unit}</span>
                        </div>`;
                    });
                }
            });

            document.getElementById('shoppingListContent').innerHTML = html;
        }

        function updateNutrition() {
            // הערכות בסיסיות
            document.getElementById('nutritionContent').innerHTML = `
                <div class="nutrition-box">
                    <strong>חלבון:</strong> ~120-150ג ליום<br>
                    <strong>פחמימות:</strong> ~150-200ג ליום<br>
                    <strong>שומנים:</strong> ~40-60ג ליום<br>
                    <strong>קלוריות:</strong> ~1800-2200 ליום
                </div>
                <p style="color: #999; margin-top: 10px; font-size: 0.85em;">הערכות - יוודקו בעדכון המערכת</p>
            `;
        }

        function editRecipeDialog(index) {
            const recipe = index === -1 ? {name: '', ingredients: '', notes: ''} : recipes[index];
            currentModal = {type: 'recipe', index};
            document.getElementById('modalTitle').textContent = index === -1 ? 'מתכון חדש' : 'ערוך מתכון';
            document.getElementById('modalBody').innerHTML = `
                <label>שם המתכון</label>
                <input type="text" id="recipeName" value="${recipe.name}">
                <label>מרכיבים (כל אחד בשורה)</label>
                <textarea id="recipeIngs" style="width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 6px;" rows="5">${recipe.ingredients}</textarea>
                <label>הערות</label>
                <input type="text" id="recipeNotes" value="${recipe.notes}">
            `;
            document.getElementById('modal').classList.add('show');
        }

        function saveModal() {
            if (currentModal.type === 'item') {
                const items = JSON.parse(localStorage.getItem('items')) || defaultItems;
                const name = document.getElementById('itemName').value;
                const qty = parseFloat(document.getElementById('itemQty').value);
                const unit = document.getElementById('itemUnit').value;
                
                if (!name || isNaN(qty)) { alert('מלאו את השדות'); return; }
                
                const item = {name, qty, unit};
                if (currentModal.index === -1) items.push(item);
                else items[currentModal.index] = item;
                
                localStorage.setItem('items', JSON.stringify(items));
                renderTable();
            } else if (currentModal.type === 'recipe') {
                const name = document.getElementById('recipeName').value;
                const ingredients = document.getElementById('recipeIngs').value;
                const notes = document.getElementById('recipeNotes').value;
                
                if (!name || !ingredients) { alert('הוסיפו שם ומרכיבים'); return; }
                
                const recipe = {name, ingredients, notes};
                if (currentModal.index === -1) recipes.push(recipe);
                else recipes[currentModal.index] = recipe;
                
                localStorage.setItem('recipes', JSON.stringify(recipes));
                renderRecipes();
            }
            closeModal();
        }

        function renderRecipes() {
            document.getElementById('recipesList').innerHTML = recipes.map((r, i) => `
                <div style="background: #fff; padding: 12px; border-radius: 8px; margin: 10px 0; border-right: 4px solid #ff9800;">
                    <h3>${r.name}</h3>
                    <p><strong>מרכיבים:</strong> ${r.ingredients.split('\n').join(', ')}</p>
                    <button class="btn-edit" onclick="editRecipeDialog(${i})">✏️</button>
                    <button class="btn-delete" onclick="deleteRecipe(${i})">🗑️</button>
                </div>
            `).join('');
        }

        function deleteRecipe(index) {
            recipes.splice(index, 1);
            localStorage.setItem('recipes', JSON.stringify(recipes));
            renderRecipes();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        window.addEventListener('DOMContentLoaded', initApp);
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(() => {});
    </script>
</body>
</html>
